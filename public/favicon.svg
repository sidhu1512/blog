<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#eab308" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background rounded square with border -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#27272a" stroke-width="4" />
  <!-- Accent accent inner rim -->
  <rect x="12" y="12" width="104" height="104" rx="22" fill="none" stroke="#eab308" stroke-width="1.5" stroke-opacity="0.2" />
  <!-- Modern Serif S glyph -->
  <text 
    x="50%" 
    y="56%" 
    text-anchor="middle" 
    dominant-baseline="central" 
    font-family="'Instrument Serif', Georgia, serif" 
    font-size="82" 
    font-weight="bold" 
    fill="url(#goldGrad)" 
    filter="url(#glow)">S</text>
  <!-- Tiny dot for brand consistency -->
  <circle cx="88" cy="88" r="5.5" fill="#eab308" filter="url(#glow)" />
</svg>
